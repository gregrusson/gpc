gpc.dashboard:
  path: '/dashboard'
  defaults:
    _controller: '\Drupal\gpc\Controller\GpcDashboardController::build'
    _title: 'GPC'
  requirements:
    _user_is_logged_in: 'TRUE'

gpc.dashboard.legacy:
  path: '/gpc'
  defaults:
    _controller: '\Drupal\gpc\Controller\GpcLegacyPathRedirectController::dashboard'
  requirements:
    _user_is_logged_in: 'TRUE'

gpc.admin:
  path: '/admin/gpc'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'GPC'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE

gpc.caliber_review_queue:
  path: '/admin/gpc/calibers/review'
  defaults:
    _controller: '\Drupal\gpc\Controller\GpcGovernanceReviewRedirectController::caliber'
  requirements:
    _permission: 'review gpc calibers'
  options:
    _admin_route: TRUE

gpc.component_review_queue:
  path: '/admin/gpc/components/review'
  defaults:
    _controller: '\Drupal\gpc\Controller\GpcGovernanceReviewRedirectController::component'
  requirements:
    _permission: 'review gpc components'
  options:
    _admin_route: TRUE

gpc.reference_discovery_report:
  path: '/admin/gpc/reference-discovery/{target_entity_type_id}/{target_entity_id}'
  defaults:
    _controller: '\Drupal\gpc\Controller\GpcReferenceDiscoveryController::build'
    _title: 'Reference discovery'
  requirements:
    _permission: 'administer gpc reference discovery'
  options:
    _admin_route: TRUE

gpc.reference_merge.landing:
  path: '/admin/gpc/reference-merge'
  defaults:
    _controller: '\Drupal\gpc\Controller\GpcReferenceMergeController::landing'
    _title: 'Reference merge'
  requirements:
    _permission: 'administer gpc reference merges'
  options:
    _admin_route: TRUE

gpc.reference_merge.form:
  path: '/admin/gpc/reference-merge/{merge_type}'
  defaults:
    _form: '\Drupal\gpc\Form\ReferenceMergeForm'
    _title: 'Reference merge preview'
  requirements:
    _permission: 'administer gpc reference merges'
  options:
    _admin_route: TRUE

gpc.reference_merge.confirm:
  path: '/admin/gpc/reference-merge/{merge_type}/confirm/{source_entity_id}/{target_entity_id}'
  defaults:
    _form: '\Drupal\gpc\Form\ReferenceMergeExecuteForm'
    _title: 'Confirm reference merge'
  requirements:
    _permission: 'administer gpc reference merges'
  options:
    _admin_route: TRUE

gpc.reference_merge.preview:
  path: '/admin/gpc/reference-merge/{merge_type}/preview/{source_entity_id}/{target_entity_id}'
  defaults:
    _controller: '\Drupal\gpc\Controller\GpcReferenceMergeController::preview'
    _title: 'Reference merge preview'
  requirements:
    _permission: 'administer gpc reference merges'
  options:
    _admin_route: TRUE

gpc.reference_merge.result:
  path: '/admin/gpc/reference-merge/result/{result_token}'
  defaults:
    _controller: '\Drupal\gpc\Controller\GpcReferenceMergeController::result'
    _title: 'Reference merge result'
  requirements:
    _permission: 'administer gpc reference merges'
  options:
    _admin_route: TRUE

