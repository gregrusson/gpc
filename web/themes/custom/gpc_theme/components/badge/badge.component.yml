$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Badge
description: Compact status badge for labels and counts.
status: stable
props:
  type: object
  additionalProperties: false
  required:
    - label
  properties:
    label:
      type: string
      title: Label
    tone:
      type: string
      title: Tone
      default: neutral
      enum:
        - neutral
        - primary
        - success
        - warning
        - danger
        - info
    pill:
      type: boolean
      title: Pill
      default: true

