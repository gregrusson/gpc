$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: App header
description: Primary application header with branding, drawer toggle, and actions.
status: stable
props:
  type: object
  additionalProperties: false
  required:
    - title
    - home_url
    - drawer_id
  properties:
    title:
      type: string
      title: Title
    subtitle:
      type:
        - string
        - 'null'
      title: Subtitle
    home_url:
      type: string
      title: Home URL
    drawer_id:
      type: string
      title: Drawer ID
    drawer_label:
      type: string
      title: Drawer label
      default: Toggle navigation
    show_drawer_toggle:
      type: boolean
      title: Show drawer toggle
      default: true
    show_theme_toggle:
      type: boolean
      title: Show theme toggle
      default: true
    actions:
      type:
        - array
        - object
        - 'null'
      title: Actions region
      description: Optional rendered actions or utility content.

